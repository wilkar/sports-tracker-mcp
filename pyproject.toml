[project]
name = "sport-tracker-mcp"
version = "0.1.0"
description = "Unofficial Sports Tracker MCP Server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

authors = [
    { name = "wilkar" }
]
keywords = ["mcp", "fastmcp", "sports-tracker", "fitness", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "cachetools>=5.3.0",
    "fastmcp>=4.0.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/wilkar/sports-tracker-mcp"
Repository = "https://github.com/wilkar/sports-tracker-mcp.git"
Issues = "https://github.com/wilkar/sports-tracker-mcp/issues"

[project.scripts]
sport-tracker-mcp = "sport_tracker_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]


